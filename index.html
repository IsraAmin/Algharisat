<body><div id="root"><p style="margin:25vh auto;text-align:center;font-family:serif">جارٍ فتح منصة الغارسات…</p></div>
<script>
  setTimeout(function () {
    if (window.__algharisatReady) return;
    document.getElementById('root').innerHTML =
      '<section style="max-width:500px;margin:15vh auto;padding:25px;text-align:center;font-family:system-ui,sans-serif;line-height:2">' +
      '<h2>تعذّر فتح منصة الغارسات</h2>' +

      '<button onclick="location.reload()" style="background:#172843;color:#fff;border:0;border-radius:9px;padding:12px 25px;cursor:pointer">إعادة المحاولة</button></section>';
  }, 12000);
  window.addEventListener('unhandledrejection',function(event) {
    console.error('خطأ في بدء تشغيل الغارسات:',event.reason);
  });
</script>
<script defer src="./app.bundle.js"></script></body></html>

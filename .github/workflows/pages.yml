name: Deploy Algharisat to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: algharisat-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --input-type=module --check < app.js
      - name: Build a self-contained browser bundle
        run: |
          npm install --no-save --no-package-lock @supabase/supabase-js@2.57.0 esbuild@0.25.12
          mkdir -p dist
          npx esbuild app.js --bundle --format=iife --platform=browser --target=es2020 --outfile=dist/app.bundle.js
          cp index.html style.css dist/
          touch dist/.nojekyll
          test -s dist/app.bundle.js
          grep -q 'app.bundle.js' dist/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
